info:
  name: POST Exercises
  type: http
  seq: 2

http:
  method: POST
  url: http://localhost:8000/api/v1/exercises/
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "nose",
        "description": "hola",
        "weight": "344",
        "reps": "123",
        "category": "cardio"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
