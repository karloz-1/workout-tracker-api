info:
  name: POST Exercises
  type: http
  seq: 2

http:
  method: POST
  url: http://localhost:8000/api/v1/exercises/
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "Curl de bíceps",
        "description": "Flexión de codo con mancuernas para trabajar el bíceps.",
        "weight": "12",
        "reps": "15",
        "category": "fuerza"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
