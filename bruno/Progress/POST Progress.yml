info:
  name: POST Progress
  type: http
  seq: 2

http:
  method: POST
  url: http://localhost:8000/api/v1/progress/
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "idExercise": "4",
        "weight": "45",
        "reps": "20"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
