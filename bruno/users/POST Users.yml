info:
  name: POST Users
  type: http
  seq: 2

http:
  method: POST
  url: http://localhost:8000/api/v1/users/
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "Carlos Gonzalez",
        "email": "carlitos@gmail.com"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
